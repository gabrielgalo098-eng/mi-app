```
<h1>🎓 Generador vs Profe 😈</h1>

<button id="btnNormal" onclick="modoNormal()">Modo Normal 😇</button>
<button id="btnEstricta" onclick="modoEstricto()">Modo Profe Estricta 😈</button>
<br>
<button id="btnGenerar" onclick="generar()">Generar respuesta 🎲</button>

<p id="resultado">Presiona un botón...</p>

<script>
    let modo = "normal";

    function modoNormal() {
        modo = "normal";
        document.body.style.background = "linear-gradient(135deg, #89f7fe, #66a6ff)";
        document.getElementById("resultado").innerText = "Modo relajado activado 😇";
    }

    function modoEstricto() {
        modo = "estricto";
        document.body.style.background = "linear-gradient(135deg, #ff4e50, #000000)";
        document.getElementById("resultado").innerText = "⚠️ Profe estricta activada ⚠️";
    }

    function generar() {
        let normal = [
            "Profe, mi perro se comió la tarea 🐶",
            "Se fue el internet 😭",
            "La hice pero no la encontré 😅"
        ];

        let estricta = [
            "¿Excusas? 0 puntos. 😐",
            "Eso no es serio. Reprobado. ❌",
            "Mañana con tu tutor. 📞",
            "Otra vez sin tarea... interesante 🤨",
            "Eso no justifica nada. 😑"
        ];

        let lista = (modo === "normal") ? normal : estricta;
        let random = Math.floor(Math.random() * lista.length);

        let resultado = document.getElementById("resultado");
        resultado.innerText = lista[random];

        if (modo === "estricto") {
            document.body.classList.add("shake");
            setTimeout(() => {
                document.body.classList.remove("shake");
            }, 300);
        }
    }
</script>
